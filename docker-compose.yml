version: '3.8'

services:
  webserver:
    build: .
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./static:/root/static
      - ./logs:/var/log/nginx
    environment:
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

