version: '3.8'

services:
  webserver:
    build: .
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./static:/root/static
      - ./logs:/var/log/nginx
    environment:
      - ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gestao_db
      - DB_USER=gestao_user
      - DB_PASSWORD=gestao_pass
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gestao_db
      POSTGRES_USER: gestao_user
      POSTGRES_PASSWORD: gestao_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao_user -d gestao_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: